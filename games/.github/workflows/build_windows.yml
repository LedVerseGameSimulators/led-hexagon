name: Build Windows EXE

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
    tags:
      - 'v*'           # e.g. v1.0.0 → also creates a GitHub Release
  workflow_dispatch:   # allows manual "Run workflow" button in GitHub UI

# ── Job ───────────────────────────────────────────────────────────────────────
jobs:
  build:
    runs-on: windows-latest    # free Windows VM from GitHub

    steps:

    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python 3.12
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # 3. Install all dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pygame pillow
        pip install fastapi "uvicorn[standard]" websockets starlette anyio
        pip install moviepy
        pip install pycryptodome rsa
        pip install loguru
        pip install pyserial
        pip install pynput

    # 4. Build RELEASE exe (no console window)
    - name: Build release exe
      run: |
        pyinstaller ledhex.spec --clean --noconfirm

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: ledhex-windows-x64-RELEASE
        path: dist/ledhex/
        retention-days: 30

    # 5. Build DEBUG exe (console window visible — shows Python errors on crash)
    - name: Build debug exe
      run: |
        $env:DEBUG_BUILD = "1"
        pyinstaller ledhex.spec --clean --noconfirm

    - name: Upload debug artifact
      uses: actions/upload-artifact@v4
      with:
        name: ledhex-windows-x64-DEBUG
        path: dist/ledhex/
        retention-days: 7

    # 6. If this is a version tag push (v1.0.0), also create a GitHub Release
    #    with a ZIP of the build attached automatically.
    - name: Zip dist folder for release
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        Compress-Archive -Path dist\ledhex\* -DestinationPath ledhex-windows.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: ledhex-windows.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
